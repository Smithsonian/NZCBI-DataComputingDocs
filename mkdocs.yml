site_name: NZCBI Data and Computing Reference Documentation
site_description: Data management and computing reference documentation for researchers and staff at the Smithsonian's National Zoo and Conservation Biology Institute
site_url: https://smithsonian.github.io/NZCBI-DataComputingDocs/
repo_url: https://github.com/Smithsonian/NZCBI-DataComputingDocs
repo_name: Smithsonian/NZCBI-DataComputingDocs
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans Pro
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - "Guide 1: Data Management Basics (In Progress)": data-management.md
  - "Guide 2: Introduction to R": R-Intro.md
  - "Guide 3: Getting Started on Hydra": hydra.md
  - "Guide 4: Running R-Studio from Hydra": RStudio-Hydra.md
  - "Guide 5: Initiate a Repo with GitHub (In Progress)": github.md
  - "Guide 6: Computing Standards (In Progress)": computing-standards.md
  - "Guide 7: Understanding the Data Lifecycle (In Progress)": data-lifecycle.md

markdown_extensions:
  - toc:
      toc_depth: 2
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  generator: false

copyright: 'NZCBI &middot; <a href="https://www.si.edu">Smithsonian Institution</a> &middot; <a href="https://www.si.edu/privacy">Privacy</a> &middot; <a href="https://www.si.edu/termsofuse">Terms of Use</a>'

extra_css:
  - stylesheets/extra.css